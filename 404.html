<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found – Lemways Nest</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#193226">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script>
/* If a property address isn't a built page (e.g. a listing added since the last deploy), open the live property viewer instead. */
(function(){var m=location.pathname.match(/^\/property\/([^\/]+)\/?$/);if(m&&!/[?&]slug=/.test(location.search))location.replace('/listing?slug='+m[1]);})();
</script>
</head>
<body>
<header class="site-header"><div class="wrap bar"><a class="brand" href="/"><img src="/logo.svg" alt="" width="40" height="40"><span>Lemways <b>Nest</b></span></a></div></header>
<main class="nf">
  <div>
    <p class="eyebrow dark">Error 404</p>
    <h1>That page isn’t at this address.</h1>
    <p>The link may be old, or the property may have been sold or let.</p>
    <p><a class="btn btn-gold" href="/#properties">See current listings</a> <a class="btn btn-ghost" href="/">Back to home</a></p>
  </div>
</main>
</body>
</html>
